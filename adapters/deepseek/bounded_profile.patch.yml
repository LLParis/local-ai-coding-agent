# Coding Intelligence's bounded production DeepSeek composition. The custom
# runner is supplied as a file URL from a per-run directory under the pinned
# install cache. Every broad model-facing capability remains disabled.
- id: agent-default-model
  config:
    provider: ci-loopback
    model: !!js process.env.CI_ADAPTER_MODEL
- id: llm-pi-ai
  config:
    providers:
      ci-loopback:
        displayName: Coding Intelligence Loopback
        api: openai-completions
        baseURL: !!js process.env.CI_ADAPTER_ENDPOINT
        apiKeyEnv: CI_ADAPTER_API_KEY
        retryPolicy:
          mode: normal
          maxRetries: 0
          backoff:
            initialDelayMs: 1
            maxDelayMs: 1
            jitterRatio: 0
        compat:
          supportsDeveloperRole: false
        models:
          - id: !!js process.env.CI_ADAPTER_MODEL
            name: Local qualified candidate
            contextWindow: 32768
            maxTokens: !!js Number(process.env.CI_ADAPTER_MAX_OUTPUT_TOKENS)
            reasoningEfforts: false

