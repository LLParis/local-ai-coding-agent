# This is deliberately non-mutating and is not a qualified tournament profile.
# It proves the exact local provider and disables known autonomous/broad rows,
# but rc.8 headless has no stable live event seam or reviewed four-tool plugin.
- id: agent-default-model
  config:
    provider: ci-loopback
    model: !!js process.env.CI_ADAPTER_MODEL
- id: llm-pi-ai
  config:
    providers:
      ci-loopback:
        displayName: Coding Intelligence Loopback
        api: openai-completions
        baseURL: !!js process.env.CI_ADAPTER_ENDPOINT
        retryPolicy:
          mode: normal
          maxRetries: 0
          backoff:
            initialDelayMs: 1
            maxDelayMs: 1
            jitterRatio: 0
        compat:
          supportsDeveloperRole: false
        models:
          - id: !!js process.env.CI_ADAPTER_MODEL
            name: Local Qwen
            contextWindow: 32768
            maxTokens: 8192
            reasoningEfforts: false
- id: llm-retry
  disabled: true
